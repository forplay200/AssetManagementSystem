name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    
    defaults:
      run:
        working-directory: backend


    steps:
    - uses: actions/checkout@v6
    - name: Use project Node.js version
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
    - run: npm ci
    - run: npm test
