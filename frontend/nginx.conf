server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Always load the current entry point after a deployment.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Missing compiled assets must not return the application's HTML.
    location /static/ {
        try_files $uri =404;
    }

    # React Router handles page URLs, including direct visits and refreshes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
